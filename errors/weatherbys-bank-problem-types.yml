  Open Data operation (/atms, /branches, /personal-current-accounts,
  /business-current-accounts). The Open Data standard returns errors as an OBError
  object (application/prs.openbanking.opendata.v{n}+json). The FAPI-secured
  Read/Write APIs (AIS/PIS/CBPII) return the OBIE Read/Write OBErrorResponse1
  envelope (RFC-style error codes such as UK.OBIE.Field.Invalid,
  UK.OBIE.Resource.NotFound, UK.OBIE.Unsupported.*); those are documented in the
  OBIE Read/Write standard and are not reproduced verbatim here.
