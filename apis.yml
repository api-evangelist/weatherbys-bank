  name: Weatherbys Bank Account and Transaction Information API (AIS)
  description: >-
    OBIE Read/Write Account and Transaction Information API (AISP). FAPI-secured (OAuth2/OIDC, mutual-TLS,
    PSD2 strong customer authentication) — requires OBIE/eIDAS certificates and dynamic client registration.
    Represented as the documented OBIE Read/Write standard for this ASPSP; base path is standard, credentials
    are not fabricated.
  humanURL: https://www.openbanking.org.uk/regulated-providers/weatherbys-bank-limited/
