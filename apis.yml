name: Weatherbys Bank
kind: company
description: >-
  Weatherbys Bank is a small, family-owned UK private bank, part of the Weatherbys
  Banking Group, trading since James Weatherby founded the family business in 1770
  and incorporated as Weatherbys Bank Limited in 1994. It serves private, business,
  and racing customers through Weatherbys Private Bank and Weatherbys Racing Bank
  from offices in London, Wellingborough, and Edinburgh, and is authorised by the
  Prudential Regulation Authority and regulated by the Financial Conduct Authority
  (FCA firm reference under Weatherbys Bank Limited). As an FCA-authorised ASPSP it
  is a regulated participant in UK Open Banking (PSD2), publishing OBIE-conformant
  surfaces - PUBLIC, unauthenticated Open Data reference APIs (ATM and branch
  locators, personal and business current account product data) and the FAPI-secured
  OBIE Read/Write APIs for Account and Transaction Information (AIS), Payment
  Initiation (PIS), and Confirmation of Funds (CBPII). It is not one of the CMA9
  mandated banks. Its Open Banking gateway is hosted on Oracle Banking APIs (BaaS)
  at openbanking.weatherbysbank.com; there is no separately branded public developer
  portal.
